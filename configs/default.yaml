# configs/default.yaml
# TierLab 默认运行与策略配置

policy: "tierlab"
backend: "mock"        # "mock" 或 "real"，换成 real 时连接 models.yaml 中的模型
seed: 0

controller:
  k_schedule: [1, 2, 4]
  k_init: 1
  local_patience: 2
  stagnation_patience: 4
  max_format_failures: 2
  local_max_tokens: 2048
  hint_max_tokens: 400
  max_feedback_chars: 2400
  top_m_for_expensive: 2
  cascade_fail_threshold: 3
  no_widen: false
  enable_lessons: false
  share_lessons_across_runs: false
  enable_diagnose_rung: false
  enable_replan_rung: false
  weak_backend: "local"
  alpha_cny_per_min: 0.006
  noise_threshold: 0.08
  backend: "mock"

budget:
  cloud_budget_cny: 5.0
  max_wall_clock_s: 300.0
  max_steps: 15
  min_delta_per_cny_threshold: 0.01
  recent_r_consultations: 3

# Code benchmark controls (Python standard library remains available).
task_options:
  code:
    allowed_libraries: [stdlib, numpy]
    max_speedup: 50.0
    timing_tolerance_s: 2.0
